<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <!-- Bus Packet Gradients -->
    <linearGradient id="busGradCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="busGradGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Radial Glow for Heartbeat LED -->
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="880" height="220" fill="url(#bg)" rx="8"/>
  <rect width="880" height="220" fill="none" stroke="#1e293b" stroke-width="1.2" rx="8"/>

  <!-- Top / Bottom Guide Lines -->
  <line x1="0" y1="32" x2="880" y2="32" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="188" x2="880" y2="188" stroke="#1e293b" stroke-width="1"/>
  <line x1="410" y1="32" x2="410" y2="188" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ==================== TOP METADATA ==================== -->
  <text x="24" y="21" class="mono" font-size="10" fill="#94a3b8" letter-spacing="1">&#x2387; main · TARGET: XILINX ARTIX-7 / ZYNQ-7000</text>
  
  <!-- Timing Met Clean Status (Separated on the right, no overlap) -->
  <g transform="translate(680, 10)">
    <circle cx="8" cy="10" r="3.5" fill="#34d399"/>
    <text x="18" y="13" class="mono" font-size="10" font-weight="600" fill="#34d399" letter-spacing="0.5">TIMING MET (WNS: +0.342ns)</text>
  </g>

  <!-- ==================== LEFT: PROFILE INFO ==================== -->
  <text x="24" y="74" font-size="30" font-weight="700" fill="#f8fafc" letter-spacing="0.5">Minh Dang</text>
  <text x="24" y="98" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="2">DIGITAL IC &amp; FPGA HARDWARE ENGINEER</text>
  <text x="24" y="122" class="mono" font-size="11" fill="#94a3b8">RTL Architecture · Clock Domain Crossing (CDC) · Bus Protocols</text>

  <!-- Micro Architecture Tags (Neat, spacious) -->
  <g transform="translate(24, 142)">
    <rect x="0" y="0" width="80" height="20" rx="3" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="14" text-anchor="middle" class="mono" font-size="9" fill="#38bdf8">ASYNC_FIFO</text>
    
    <rect x="88" y="0" width="76" height="20" rx="3" fill="#1e293b" stroke="#334155"/>
    <text x="126" y="14" text-anchor="middle" class="mono" font-size="9" fill="#34d399">SKID_BUF</text>

    <rect x="172" y="0" width="74" height="20" rx="3" fill="#1e293b" stroke="#334155"/>
    <text x="209" y="14" text-anchor="middle" class="mono" font-size="9" fill="#fbbf24">UART / I2C</text>

    <rect x="254" y="0" width="112" height="20" rx="3" fill="#1e293b" stroke="#334155"/>
    <text x="310" y="14" text-anchor="middle" class="mono" font-size="9" fill="#a78bfa">HFT_MEM_TEST</text>
  </g>

  <!-- ==================== BOTTOM TELEMETRY ==================== -->
  <text x="24" y="206" class="mono" font-size="10" fill="#64748b" letter-spacing="0.5">UTILIZATION: LUT 2.4% · BRAM 5.9% · DSP48 4</text>
  <text x="856" y="206" text-anchor="end" class="mono" font-size="10" fill="#38bdf8" letter-spacing="1">CLOCK: 250.000 MHz (MET)</text>

  <!-- ==================== RIGHT: LOGIC ANALYZER / OSCILLOSCOPE ==================== -->
  <!-- Screen Box -->
  <rect x="424" y="38" width="436" height="142" rx="6" fill="#070c16" stroke="#1e293b"/>
  
  <!-- Oscilloscope Grid Lines (Phosphor Reticle) -->
  <g stroke="#131c2d" stroke-width="0.75" stroke-dasharray="2 3">
    <!-- Vertical Time Grids -->
    <line x1="500" y1="44" x2="500" y2="174"/>
    <line x1="560" y1="44" x2="560" y2="174"/>
    <line x1="620" y1="44" x2="620" y2="174"/>
    <line x1="680" y1="44" x2="680" y2="174"/>
    <line x1="740" y1="44" x2="740" y2="174"/>
    <line x1="800" y1="44" x2="800" y2="174"/>
    <!-- Horizontal Dividers -->
    <line x1="432" y1="78" x2="852" y2="78"/>
    <line x1="432" y1="108" x2="852" y2="108"/>
    <line x1="432" y1="138" x2="852" y2="138"/>
  </g>

  <!-- Title bar of Analyzer -->
  <text x="436" y="53" class="mono" font-size="9" fill="#94a3b8" font-weight="600" letter-spacing="0.5">ILA CORE · AXI4-STREAM INTERFACE</text>

  <!-- Pulsing PLL Heartbeat Indicator (Clear on the right) -->
  <g transform="translate(815, 43)">
    <text x="18" y="10" text-anchor="end" class="mono" font-size="8" font-weight="600" fill="#34d399">RUN</text>
    <circle cx="28" cy="7" r="7" fill="url(#ledGlow)">
      <animate attributeName="r" values="5;8;5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="7" r="3" fill="#34d399"/>
  </g>

  <!-- ==================== WAVEFORM CHANNELS ==================== -->
  
  <!-- CH1: CLK (High Resolution 200MHz Square Wave) -->
  <text x="436" y="73" class="mono" font-size="9" fill="#38bdf8" font-weight="600">clk</text>
  <path d="M 495 74 L 507 74 L 507 63 L 519 63 L 519 74 L 531 74 L 531 63 L 543 63 L 543 74 L 555 74 L 555 63 L 567 63 L 567 74 L 579 74 L 579 63 L 591 63 L 591 74 L 603 74 L 603 63 L 615 63 L 615 74 L 627 74 L 627 63 L 639 63 L 639 74 L 651 74 L 651 63 L 663 63 L 663 74 L 675 74 L 675 63 L 687 63 L 687 74 L 699 74 L 699 63 L 711 63 L 711 74 L 723 74 L 723 63 L 735 63 L 735 74 L 747 74 L 747 63 L 759 63 L 759 74 L 771 74 L 771 63 L 783 63 L 783 74 L 795 74 L 795 63 L 807 63 L 807 74 L 819 74 L 819 63 L 831 63 L 831 74 L 843 74 L 843 63 L 852 63" fill="none" stroke="#38bdf8" stroke-width="1.3" opacity="0.9"/>

  <!-- CH2: TVALID (Master Transfer Request) -->
  <text x="436" y="102" class="mono" font-size="9" fill="#34d399" font-weight="600">tvalid</text>
  <path d="M 495 104 L 528 104 L 530 92 L 670 92 L 672 104 L 708 104 L 710 92 L 838 92 L 840 104 L 852 104" fill="none" stroke="#34d399" stroke-width="1.4"/>

  <!-- CH3: TREADY (Slave Backpressure) -->
  <text x="436" y="131" class="mono" font-size="9" fill="#fbbf24" font-weight="600">tready</text>
  <path d="M 495 122 L 608 122 L 610 133 L 642 133 L 644 122 L 810 122 L 812 133 L 852 133" fill="none" stroke="#fbbf24" stroke-width="1.4"/>

  <!-- CH4: TDATA [31:0] (Bus Packets - Wide & Spaced out to prevent any overlap) -->
  <text x="436" y="161" class="mono" font-size="9" fill="#e2e8f0" font-weight="600">tdata</text>
  
  <!-- Bus Packet 1: 530 to 650 (Width 120px) -->
  <g>
    <polygon points="532,164 540,149 642,149 648,164 642,178 540,178" fill="url(#busGradCyan)" stroke="#38bdf8" stroke-width="1.1"/>
    
    <!-- State A (0s - 2.5s) -->
    <text x="590" y="167" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#f8fafc">
      0x534F4331
      <animate attributeName="display" values="inline;inline;none;none;inline" keyTimes="0;0.48;0.5;0.98;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <!-- State B (2.5s - 5s) -->
    <text x="590" y="167" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#38bdf8">
      0xDEADC0DE
      <animate attributeName="display" values="none;none;inline;inline;none" keyTimes="0;0.48;0.5;0.98;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Bus Packet 2: 708 to 828 (Width 120px) -->
  <g>
    <polygon points="710,164 718,149 820,149 826,164 820,178 718,178" fill="url(#busGradGreen)" stroke="#34d399" stroke-width="1.1"/>
    
    <!-- State A (0s - 2.5s) -->
    <text x="768" y="167" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#f8fafc">
      0xCAFEBABE
      <animate attributeName="display" values="inline;inline;none;none;inline" keyTimes="0;0.48;0.5;0.98;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <!-- State B (2.5s - 5s) -->
    <text x="768" y="167" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#34d399">
      0x00A55A00
      <animate attributeName="display" values="none;none;inline;inline;none" keyTimes="0;0.48;0.5;0.98;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Idle bus lines -->
  <line x1="495" y1="164" x2="530" y2="164" stroke="#475569" stroke-width="1.2"/>
  <line x1="650" y1="164" x2="708" y2="164" stroke="#475569" stroke-width="1.2"/>
  <line x1="828" y1="164" x2="852" y2="164" stroke="#475569" stroke-width="1.2"/>

</svg>
